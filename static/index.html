<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RETRO-RUNNERS</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Mono:wght@400;700&family=Unbounded:wght@900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d352e;--bg2:#264a3f;--cream:#eadfc4;--red:#d0432b;--gold:#d9a441;--ink:#14100d;--cy:#35e0f0;--pur:#2b1e45;--pk:#ff2f8e;--vi:#7b2ff7;--paper:#e4e0d2;--hfg:#14100d;--disp:'Rubik Mono One',Impact,sans-serif;--mono:'Space Mono',ui-monospace,monospace;--crt:'VT323',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth;scroll-padding-top:64px;background:var(--bg)}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;background:var(--bg) radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.4px) 0 0/6px 6px;color:var(--cream);font:400 1rem/1.6 var(--mono);overflow-x:hidden}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:60;width:0}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;padding:8px clamp(14px,3vw,32px);padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--ink);border-bottom:3px solid var(--red);overflow-x:auto}
nav b{background:var(--red);color:var(--cream);font:900 .8rem var(--disp);padding:4px 8px;flex:none}nav a{color:var(--cream);text-decoration:none;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;flex:none;padding:10px 0}nav a:hover{color:var(--gold)}nav .btn{flex:none}#tbtn{margin-left:auto;background:var(--cream)}#tpick{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:12px;z-index:55;background:var(--ink);color:var(--cream);border:3px solid var(--cream);box-shadow:6px 6px 0 var(--red);padding:14px;width:min(340px,calc(100vw - 24px))}#tpick b{font-size:.75rem;letter-spacing:.16em;color:var(--gold)}#tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.tp{font:700 .75rem var(--mono);text-transform:uppercase;background:transparent;color:var(--cream);border:2px solid var(--cream);padding:8px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.tp.on{background:var(--cream);color:var(--ink)}.sw{display:flex;width:100%;height:12px;border:1px solid #fff5}.sw i{flex:1}
.btn,.cb{font:700 .8125rem var(--mono);min-height:44px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 14px;cursor:pointer;text-transform:uppercase}.btn.r{background:var(--red);color:#fff}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
section{padding:clamp(64px,9vw,112px) clamp(20px,5vw,48px);position:relative}section>*{max-width:1200px;margin-left:auto;margin-right:auto}
.head{margin-bottom:clamp(28px,4vw,48px)}.lab{font:700 .75rem var(--mono);color:var(--gold);letter-spacing:.2em}
h2{font:900 clamp(1.6rem,4vw,2.6rem)/1.1 var(--disp);text-transform:uppercase;text-shadow:2px 2px 0 var(--red);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px}.empty{opacity:.7}
.rv{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(30px);transition:.7s cubic-bezier(.2,.9,.3,1)}.rv.in{opacity:1;transform:none}
/* hero */
#hero{background:var(--paper) radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.4px) 0 0/6px 6px;color:var(--hfg);min-height:100vh;padding-top:88px;padding-bottom:22px;display:flex;flex-direction:column;gap:20px;perspective:1400px;overflow:hidden}#hero>*{width:100%}
.hbar{display:flex;align-items:center;gap:14px;font:700 .75rem var(--mono);letter-spacing:.1em}.hbar .lg{background:var(--red);color:#fff;width:34px;height:34px;display:grid;place-items:center}.hbar b{font:900 clamp(1.1rem,2.4vw,1.6rem) var(--disp)}.hbar .sp{margin-left:auto}
.stage{position:relative;flex:1;min-height:clamp(320px,52vh,520px);border:3px solid var(--hfg);display:grid;place-items:center;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.big{--bw:9.5;font:900 clamp(2.4rem,calc(var(--bw)*1vw),7.5rem)/.86 var(--disp);text-align:center;letter-spacing:-.05em;color:var(--hfg);text-shadow:3px 3px 0 var(--paper),7px 7px 0 var(--red);transform:translateZ(50px);pointer-events:none}
.kanji{position:absolute;left:7%;top:10%;font:900 clamp(3rem,11vw,8rem)/1 'Noto Serif JP','Noto Serif SC',serif;color:var(--red);transform:translateZ(130px) rotate(-6deg);pointer-events:none;text-shadow:3px 3px 0 rgba(20,16,13,.25)}
.stk{position:absolute;left:6%;bottom:9%;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:10px 14px;font:900 clamp(.7rem,1.6vw,1rem) var(--disp);transform:translateZ(160px) rotate(-6deg);text-align:center;pointer-events:none}
.vert{position:absolute;right:8px;top:50%;writing-mode:vertical-rl;font:700 .625rem var(--mono);letter-spacing:.3em}
.hfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.hfoot h3{font:900 clamp(1rem,2vw,1.4rem) var(--disp);margin:0}.hfoot p{margin:4px 0 12px;max-width:460px;font-size:.9375rem}.sn{font:900 clamp(1rem,2vw,1.4rem) var(--disp)}
.reach{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 16px}.chip{display:flex;align-items:center;gap:10px;background:var(--hfg);color:var(--paper);border:3px solid var(--hfg);box-shadow:4px 4px 0 var(--red);padding:6px 6px 6px 12px;min-height:52px}.ci{font-size:1.25rem}.cv{display:flex;flex-direction:column;line-height:1.25;font-size:.9375rem;font-weight:700;min-width:0}.cv small{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}.cv a{color:inherit;text-decoration:none;overflow-wrap:anywhere}.cv a:hover{text-decoration:underline}
.cp{font:700 .6875rem var(--mono);letter-spacing:.08em;min-height:40px;padding:0 12px;background:var(--gold);color:#14100d;border:2px solid #14100d;box-shadow:3px 3px 0 #14100d;cursor:pointer}.cp:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #14100d}@media(max-width:520px){.chip{width:100%}.cv{flex:1}}
.bar{height:42px;background:repeating-linear-gradient(90deg,var(--hfg) 0 3px,transparent 3px 6px,var(--hfg) 6px 7px,transparent 7px 12px,var(--hfg) 12px 18px,transparent 18px 20px,var(--red) 20px 22px,transparent 22px 27px)}
.tick{background:var(--red);color:#fff;border-block:3px solid var(--ink);overflow:hidden;white-space:nowrap;font:700 .8125rem var(--mono);letter-spacing:.12em;padding:10px 0}.trk{display:inline-flex;animation:mq 60s linear infinite}.trk span{padding-right:0}@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--ink);border-bottom:3px solid var(--red);max-width:none!important}.stat{padding:24px 16px;text-align:center;border-right:2px dashed #fff2}.stat b{display:block;font:900 clamp(1.6rem,4vw,2.6rem) var(--disp);color:var(--gold)}.stat span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
/* cards */
.pc{background:var(--c);color:#111;border:3px solid var(--ink);border-radius:18px;padding:16px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.tilt{transform:perspective(800px) rotateX(var(--x,0deg)) rotateY(var(--y,0deg));transition:transform .15s ease-out}
.pt{display:flex;justify-content:space-between;font:700 .625rem var(--mono);letter-spacing:.06em}.ttl{font:900 1.125rem/1.1 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.body{display:grid;grid-template-columns:1fr 56px;gap:10px;height:96px}.art{border:2px solid #111;border-radius:10px;display:grid;place-items:center;font-size:2.8rem;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.mt{border:2px solid #111;border-radius:10px;display:flex;align-items:flex-end;gap:4px;padding:6px}.mt i{flex:1;background:#111;border-radius:2px}
.d{margin:0;font-size:.875rem;border:2px solid #111;border-radius:8px;padding:6px 8px;min-height:52px}.pf{display:flex;align-items:center;gap:10px;font:900 .8125rem var(--disp)}.pf s{flex:1;height:14px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 5px,#111 5px 6px,transparent 6px 10px)}.vb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:#111;color:#fff;border:3px solid #111;box-shadow:4px 4px 0 rgba(0,0,0,.35);font:900 .8125rem var(--disp);text-transform:uppercase;text-decoration:none;letter-spacing:.04em;padding:8px 12px}.vb b{color:var(--c);font-size:1.15rem}a.vb:hover{background:var(--c);color:#111}a.vb:hover b{color:#111}a.vb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}.vb.off{background:transparent;color:#111;border-style:dashed;box-shadow:none;opacity:.6;font:400 .75rem var(--mono)}
/* services + skills */
#services{background:var(--pur)}.svc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.sc{font:inherit;text-align:left;cursor:pointer;background:var(--c);color:#111;border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}.sc .ic{font-size:2rem;line-height:1}.sc b{font:900 1rem/1.15 var(--disp);text-transform:uppercase}.sc span:last-child{font-size:.8125rem}.sc.on{outline:4px solid var(--gold);outline-offset:3px;box-shadow:10px 10px 0 var(--ink)}
.meters{background:var(--ink);border:3px solid var(--cream);border-radius:14px;box-shadow:8px 8px 0 var(--red);padding:20px;position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;letter-spacing:.14em;color:var(--gold);border-bottom:2px dashed #fff3;padding-bottom:10px}
.mr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;transition:opacity .2s}.mr.dim{opacity:.28}.mr.hl .mn{color:var(--gold)}.mn{font-weight:700;font-size:.875rem;text-transform:uppercase}.ml{font:1.15rem/1 var(--crt);color:var(--c)}
.mb{grid-column:1/-1;height:14px;border:2px solid var(--cream);background:#0008;position:relative}.mb i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);transition:width 1.1s cubic-bezier(.2,.9,.3,1)}.mb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--ink) 9px 11px)}.rv.in .mb i{width:var(--w)}.mnote{font-size:.75rem;opacity:.7;margin:0}
@media(max-width:900px){.svc{grid-template-columns:1fr}.meters{position:static}}
/* styles */
.st{background:var(--sb);color:var(--sf);border:3px solid var(--sa);box-shadow:6px 6px 0 var(--sa);padding:20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-height:230px}.st h3{margin:0;line-height:1.1;text-transform:uppercase}.st p{margin:0;font-size:.9375rem;flex:1}.stl{display:flex;justify-content:space-between;font-size:.6875rem;letter-spacing:.12em;opacity:.8}.mock{display:flex;gap:6px}.mock i{height:10px;flex:1;background:var(--sa)}.mock i:nth-child(2){background:var(--sf)}.mock i:nth-child(3){flex:.4;opacity:.5}.stb{align-self:flex-start;background:var(--sf);color:var(--sb);padding:8px 12px;font-size:.75rem;text-transform:uppercase}
/* crew tv */
#team{background:#12081a}.tv{max-width:880px}.tvb{display:grid;grid-template-columns:1fr 70px;gap:12px;background:#2a1a30;border:6px solid #000;border-radius:28px;padding:16px;box-shadow:12px 12px 0 #000,0 0 0 4px var(--pk),0 0 40px color-mix(in srgb,var(--pk) 40%,transparent)}
.scr{position:relative;background:var(--pk);color:#1a0510;border:4px solid #000;border-radius:14px;overflow:hidden;font-family:var(--crt);padding:10px;min-height:340px;display:flex;flex-direction:column;gap:10px}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
.tb{display:flex;justify-content:space-between;background:#000;color:var(--pk);padding:2px 8px;font-size:1.4rem;letter-spacing:.1em}
.tvm{flex:1;display:grid;grid-template-columns:minmax(150px,1fr) 1.3fr;gap:10px}.scr.gl .tvm{animation:gl .35s steps(4)}@keyframes gl{0%{transform:translateX(-10px);filter:hue-rotate(70deg) contrast(1.6)}50%{transform:translateX(7px) skewX(5deg)}100%{transform:none}}
.ph{position:relative;background:var(--pk);border:3px solid #000;min-height:240px;display:grid;place-items:center;font-size:5rem;overflow:hidden}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.3);mix-blend-mode:multiply}.ph::before{content:"";position:absolute;inset:0;background:var(--vi);mix-blend-mode:screen;opacity:.55;z-index:1;pointer-events:none}
.inf{display:flex;flex-direction:column;gap:8px;min-width:0}.nm{font:900 clamp(1.4rem,3.2vw,2rem)/1 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}.rn{font:1.4rem/1 var(--crt);letter-spacing:.06em}.rl{background:#000;color:var(--pk);padding:2px 8px;font-size:1.5rem;align-self:flex-start}
.bub{flex:1;background:#12081a;color:var(--pk);filter:brightness(1.25);border:3px solid #000;padding:10px;font-size:1.5rem;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}.acts{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:14px;height:14px;border:2px solid #000;background:var(--vi);cursor:pointer}.dots i.on{background:#000}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:10px}.knob{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--vi) 60%,#000);border:3px solid #000}.grille{flex:1;width:34px;background:repeating-linear-gradient(0deg,#000 0 3px,transparent 3px 8px)}
.ctl{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:28px}
.cb{letter-spacing:.06em;background:var(--pk);color:#12081a;box-shadow:5px 5px 0 #000,inset 0 -4px 0 #0003;text-decoration:none;display:inline-block;padding:10px 16px}.cb.alt{background:var(--vi);color:#fff}.cb:hover{filter:brightness(1.15)}.cb:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}.cb.on{outline:3px solid var(--cy);outline-offset:2px}
@media(max-width:600px){.tvm,.tvb{grid-template-columns:1fr}.tvb{padding:12px}.side{flex-direction:row;padding:0}.grille{height:30px;width:auto}}
/* contact + game */
#contact{background:var(--ink)}#game{background:var(--pur)}
.crt{background:#08130f;border:8px solid var(--cream);outline:4px solid var(--ink);border-radius:20px;box-shadow:12px 12px 0 var(--ink);padding:24px;max-width:760px;font-family:var(--crt);font-size:1.4rem;color:#7dffb0;text-shadow:0 0 8px #3f9;position:relative;overflow:hidden}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px)}.crt label{display:block;margin:10px 0}.crt input,.crt textarea{display:block;width:100%;background:#0b2118;border:2px solid #7dffb0;color:#dfffe9;font:1.25rem var(--crt);padding:6px 8px;margin-top:4px}.crt .btn{margin-top:8px}
#gc{width:100%;max-width:720px;display:block;border:6px solid var(--cream);box-shadow:10px 10px 0 var(--ink);background:#1a1030;cursor:pointer;touch-action:manipulation}
footer{padding:26px 5vw;background:var(--ink);border-top:3px solid var(--red);font-size:.6875rem;text-align:center;letter-spacing:.1em;order:99}
/* admin */
#adm{position:fixed;top:0;right:0;bottom:0;width:min(1040px,100%);background:#efe8d4;color:#14100d;z-index:80;display:flex;flex-direction:column;border-left:5px solid #14100d;transform:translateX(105%);transition:transform .3s;font-size:.875rem}#adm.on{transform:none}
.ahd{display:flex;align-items:center;gap:12px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:#14100d;color:#eadfc4}.ahd h3{font:900 1.1rem var(--disp);margin:0;flex:1}
#gate{padding:24px;max-width:360px}#ap{display:grid;grid-template-columns:190px minmax(0,1fr);flex:1;min-height:0}
#at{display:flex;flex-direction:column;gap:4px;padding:12px;background:#d9d1bd;border-right:3px solid #14100d;overflow:auto}#at button{font:700 .75rem var(--mono);text-align:left;text-transform:uppercase;background:none;border:2px solid transparent;padding:10px;cursor:pointer;color:#14100d;min-height:40px}#at button.on{background:#14100d;color:#eadfc4}#at button:hover:not(.on){border-color:#14100d}
#ac{padding:20px 24px 60px;overflow:auto}#ac h4,#gate h4{font:900 1rem var(--disp);margin:0 0 14px}.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.lh h4{margin:0}
#adm label{display:block;font:700 .6875rem var(--mono);text-transform:uppercase;letter-spacing:.04em}#adm input:not([type=color],[type=range],[type=checkbox],[type=file]),#adm textarea,#adm select{display:block;width:100%;border:2px solid #14100d;background:#fffdf5;padding:8px;font:.8125rem var(--mono);margin-top:4px;color:#14100d}#adm textarea{resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:8px}.fg .w{grid-column:1/-1}
#adm details{border:3px solid #14100d;background:#fffaf0;margin-bottom:10px}#adm summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-weight:700;background:#e4dcc4}#adm details[open] summary{border-bottom:3px solid #14100d}#adm details>.fg{padding:14px}
.ops{display:flex;gap:4px}.ops button{width:32px;height:32px;border:2px solid #14100d;background:#fff;cursor:pointer;font-size:.75rem}.ops .dl{background:#d0432b;color:#fff}
.cw{display:flex;gap:6px;margin-top:4px}.cw input[type=color]{width:44px;height:38px;padding:0;border:2px solid #14100d;flex:none;cursor:pointer}.cw input:not([type=color]){margin:0!important}
.im{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}.im img{width:56px;height:56px;object-fit:cover;border:2px solid #14100d}.ck{display:flex!important;gap:8px;align-items:center;min-height:38px}.pre{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}#adm .btn{font-size:.75rem}
@media(max-width:720px){#ap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}#at{flex-direction:row;border-right:0;border-bottom:3px solid #14100d}#at button{flex:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:var(--cream);padding:10px 16px;border:3px solid var(--gold);transition:transform .3s;z-index:90;max-width:90vw}#toast.on{transform:translate(-50%,0)}

/* ===== hero balance + layout polish ===== */
.hfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:end}.ht{display:flex;flex-direction:column;align-items:flex-start}.ht p{margin:6px 0 16px}
.reach{flex-direction:column;flex-wrap:nowrap;margin:0;width:min(100%,380px);gap:12px}.chip{width:100%}.cv{flex:1}
.brow{display:flex;align-items:center;gap:20px}.brow .bar{flex:1}.sn{white-space:nowrap}
.stk{left:auto;right:7%;bottom:9%}.vert{top:9%}
@media(max-width:760px){.hfoot{grid-template-columns:1fr}.reach{width:100%}.brow{flex-direction:column;align-items:stretch;gap:12px}.brow .bar{flex:none}.sn{text-align:right}}
@media(min-width:901px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
#st{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}#st .st{flex:0 1 calc(25% - 18px);min-width:220px}@media(max-width:900px){#st .st{flex-basis:calc(50% - 12px);min-width:0}}@media(max-width:520px){#st .st{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.stage,.tilt{transform:none!important}.trk{animation:none}.scr.gl .tvm{animation:none!important}}
</style></head><body>
<div id="prog"></div>
<nav><b id="nb"></b><span id="nv" style="display:contents"></span><button class="btn" id="tbtn" aria-haspopup="true" aria-expanded="false">◐ Theme</button><button class="btn" id="ab">Admin</button></nav>
<div id="tpick" hidden role="dialog" aria-label="Choose a theme"><b>PICK A THEME</b><div id="tgrid"></div></div>

function load(j){const d=cl(DEF);j=j||{};if(j.v>=3){d.site={...d.site,...j.site};d.theme={...d.theme,...j.theme};['projects','services','skills','styles','crew','stats'].forEach(k=>{if(Array.isArray(j[k]))d[k]=j[k]});

else{if(j.tag)d.site.tag=j.tag;if(j.email)d.site.email=j.email;if(Array.isArray(j.crew))d.crew=j.crew.map(m=>C(m.nick||m.name||'',m.real||'',m.role||'',m.tag||'',m.link||'',m.email||(/@/.test(m.contact||'')&&!okL(m.contact)?m.contact:'')))}

function applyTheme(){const r=document.documentElement.style,T=D.site.allowTheme&&PRESETS[vth]?{...D.theme,...PRESETS[vth]}:D.theme;Object.keys(PRESETS.retro).forEach(k=>r.setProperty('--'+k,hx(T[k])));r.setProperty('--disp',`'${FONTS.includes(T.fd)?T.fd:FONTS[0]}',Impact,sans-serif`)}
function applySite(){const S=D.site;document.title=S.name;$('nb').textContent=S.brand;$('hname').textContent=S.name;$('hcode').textContent=S.code;$('hw1').textContent=S.w1;$('hw2').textContent=S.w2;

$('nv').innerHTML='<a href="#hero">Home</a>'+D.sections.filter(s=>s.show).map(s=>`<a href="#${s.id}">${esc(s.nav)}</a>`).join('')}
function renderProjects(){$('pj').innerHTML=D.projects.map((p,i)=>{const c=hx(p.color),t=p.title||'';return`<div class="pc tilt" style="--c:${c}"><div class="pt"><span>${pad(i+1)}</span><span>${esc(p.tag)}</span></div><div class="ttl" style="font-size:${t.length>20?.95:1.125}rem">${esc(t)}</div><div class="body"><div class="art">${okI(p.image)?`<img src="${esc(p.image)}" alt="">`:esc(p.icon||'📦')}</div><div class="mt"><i style="height:${30+i*23%60}%"></i><i style="height:${50+i*31%45}%"></i><i style="height:${25+i*13%65}%"></i></div></div><p class="d">${esc(p.desc)}</p>${okL(p.link)?`<a class="vb" href="${esc(p.link)}" target="_blank" rel="noopener">View project <b>↗</b></a>`:'<span class="vb off">Link coming soon</span>'}<div class="pf"><span>${c.toUpperCase()}</span><s></s></div></div>`}).join('')||'<p class="empty">No projects yet — add some in Admin.</p>'}
function renderServices(){$('sv').innerHTML=D.services.map((s,i)=>`<button class="sc tilt${sel==(s.title||'').toLowerCase()?' on':''}" data-sv="${esc((s.title||'').toLowerCase())}" style="--c:${hx(s.color)}"><span class="ic">${esc(s.icon)}</span><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></button>`).join('')||'<p class="empty">No services yet.</p>';

function go(n){const N=D.crew.length;if(!N)return;if(n=='next')ci++;else if(n=='prev')ci--;else if(n=='first')ci=0;else if(n=='last')ci=N-1;else if(n=='rand')ci=Math.floor(Math.random()*N);else if(typeof n=='number')ci=n;const s=document.querySelector('.scr');s.classList.remove('gl');void s.offsetWidth;s.classList.add('gl');renderCrew()}

const hero=$('hero'),stg=$('stage');hero.onpointermove=e=>{if(RM)return;const r=hero.getBoundingClientRect();stg.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');stg.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*10+'deg')};hero.onpointerleave=()=>{stg.style.setProperty('--ry','0deg');stg.style.setProperty('--rx','0deg')};
try{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.id=='stats')countUp();io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.rv,#stats').forEach(e=>io.observe(e))}catch(e){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));countUp()}
document.addEventListener('click',e=>{const b=e.target.closest('.cp');if(b){copy(b.dataset.copy,b.dataset.w);b.textContent='COPIED ✔';setTimeout(()=>b.textContent='COPY',1500)}});
$('cf').onsubmit=e=>{e.preventDefault();toast('TRANSMISSION SENT ✔ opening mail…');location.href=`mailto:${D.site.email}?subject=${encodeURIComponent('Project from '+$('cn').value)}&body=${encodeURIComponent($('cm').value+'\n\n'+$('ce').value)}`};
$('tbtn').onclick=()=>{const h=$('tpick').hidden=!$('tpick').hidden;$('tbtn').setAttribute('aria-expanded',String(!h))};
$('tgrid').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;vth=b.dataset.th;try{vth?localStorage.setItem('rr-theme',vth):localStorage.removeItem('rr-theme')}catch(x){}applyTheme();buildPick();toast(vth?'Theme: '+vth:'Theme: site default')};
document.addEventListener('click',e=>{if(!$('tpick').hidden&&!e.target.closest('#tpick,#tbtn'))$('tpick').hidden=true});
/* ===== admin ===== */
const A=$('adm'),open=new Set();let cur='general';
const TABS=[['general','General'],['hero','Hero'],['theme','Theme & colours'],['sections','Sections & order'],['projects','Projects'],['services','Services'],['skills','Skills'],['styles','Website styles'],['crew','Crew'],['stats','Stats'],['contact','Contact'],['game','Game'],['data','Backup & reset']];
const SET={general:[['name','Site name'],['brand','Nav badge text'],['code','Top-right code'],['email','Email (shown in hero + contact form)'],['phone','Phone number (blank = hide)'],['allowTheme','Let visitors switch the theme','k'],['ticker','Scrolling ticker text','t'],['svcNote','Services hint text'],['footer','Footer text']],
hero:[['kicker','Kicker line'],['w1','Big word 1'],['w2','Big word 2'],['kanji','Red stamp text (blank = hide)'],['sticker','Gold sticker (blank = hide)'],['tag','Tagline','t'],['cta','Button text'],['serial','Serial text'],['side','Vertical text']],
contact:[['greet','Terminal greeting (one line per row)','t'],['send','Send button text']],game:[['gameSpeed','Game speed (1-10)','r:1:10'],['gameHint','Hint text']]};
const SCH={projects:{t:'Projects',one:'project',name:p=>p.title,f:[['title','Title'],['tag','Tag'],['icon','Icon / emoji'],['color','Card colour','c'],['desc','Description','t'],['link','Link (https://…)'],['image','Image (replaces icon)','i']],n:()=>({title:'New project',tag:'WEB',icon:'📦',color:AC[Math.floor(Math.random()*6)],desc:'',link:'',image:''})},
services:{t:'Services',one:'service',name:s=>s.icon+' '+s.title,f:[['title','Title'],['icon','Icon / emoji'],['color','Card colour','c'],['desc','Description','t']],n:()=>({title:'New service',desc:'',icon:'✨',color:AC[Math.floor(Math.random()*6)]})},
skills:{t:'Skills',one:'skill',name:k=>k.name+' — '+k.level+'%',f:[['name','Skill'],['level','Level','r:0:100'],['services','Used in services (comma-separated service titles)','w']],n:()=>({name:'New skill',level:70,services:''})},
styles:{t:'Website styles',one:'style',name:s=>s.name,f:[['name','Name'],['desc','Description','t'],['bg','Background','c'],['fg','Text','c'],['accent','Accent','c']],n:()=>({name:'New style',desc:'',bg:'#222222',fg:'#ffffff',accent:'#ff2f8e'})},
crew:{t:'Crew',one:'member',name:m=>m.nick+' ('+m.real+')',f:[['nick','Nickname (main name)'],['real','Real name'],['role','Role'],['tag','Tag line','t'],['link','Portfolio link (https://…)'],['email','Email (copied by Connect)'],['photo','Photo','i']],n:()=>C('NEWBIE','Real Name','Role','Your tag line','','')},
stats:{t:'Stats',one:'stat',name:s=>s.value+' '+s.label,f:[['value','Value (e.g. 48+)'],['label','Label']],n:()=>({value:'10+',label:'New stat'})}};
const COL={bg:'Page background',bg2:'Panel background',cream:'Text / bezels',red:'Accent red',gold:'Accent gold',ink:'Ink / borders / nav',cy:'Cyan highlight',pur:'Services & game background',pk:'Crew TV colour',vi:'Crew TV secondary',paper:'Hero background',hfg:'Hero text'};
const get=p=>p.split('.').reduce((o,k)=>o?.[k],D),set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],D)[l]=v};
function fld(p,l,ty,v){ty=ty||'';const [k,a,b]=ty.split(':');
if(k=='t')return`<label class="w">${l}<textarea rows="3" data-p="${p}">${esc(v)}</textarea></label>`;
if(k=='c')return`<label>${l}<span class="cw"><input type="color" data-p="${p}" value="${full(v)}"><input data-p="${p}" value="${esc(v)}"></span></label>`;
if(k=='r')return`<label>${l}: <b>${esc(v)}</b><input type="range" min="${a}" max="${b}" data-p="${p}" value="${esc(v)}" style="width:100%"></label>`;
if(k=='i')return`<label class="w">${l}<span class="im">${okI(v)?`<img src="${esc(v)}" alt="">`:''}<input type="file" accept="image/*" data-up="${p}">${v?`<button class="btn r" data-act="clr:${p}">Clear</button>`:''}</span></label>`;
if(k=='k')return`<label class="ck"><input type="checkbox" data-p="${p}"${v?' checked':''}> ${l}</label>`;
if(k=='s')return`<label>${l}<select data-p="${p}">${FONTS.map(f=>`<option${f==v?' selected':''}>${f}</option>`).join('')}</select></label>`;
return`<label${k=='w'?' class="w"':''}>${l}<input data-p="${p}" value="${esc(v)}"></label>`}
function listEd(k){const S=SCH[k],L=D[k];return`<div class="lh"><h4>${S.t} (${L.length})</h4><button class="btn" data-act="add:${k}">+ Add ${S.one}</button></div>`+(L.map((it,i)=>`<details data-k="${k}.${i}"${open.has(k+'.'+i)?' open':''}><summary><span>${pad(i+1)} · ${esc(S.name(it)||'(untitled)')}</span><span class="ops"><button data-act="up:${k}:${i}" title="Move up">▲</button><button data-act="dn:${k}:${i}" title="Move down">▼</button><button data-act="dup:${k}:${i}" title="Duplicate">⧉</button><button class="dl" data-act="del:${k}:${i}" title="Delete">✕</button></span></summary><div class="fg">${S.f.map(([f,l,t])=>fld(`${k}.${i}.${f}`,l,t,it[f])).join('')}</div></details>`).join('')||'<p>Nothing here yet — add one!</p>')}
function view(t){
if(SET[t])return`<h4>${TABS.find(x=>x[0]==t)[1]}</h4><div class="fg">${SET[t].map(([k,l,ty])=>fld('site.'+k,l,ty,D.site[k])).join('')}</div>`;
if(SCH[t])return listEd(t);
if(t=='sections')return`<h4>Sections — show, hide, rename, reorder</h4>`+D.sections.map((s,i)=>`<details data-k="sections.${i}"${open.has('sections.'+i)?' open':''}><summary><span>${pad(i+1)} · ${esc(s.title)} ${s.show?'':'(hidden)'}</span><span class="ops"><button data-act="up:sections:${i}">▲</button><button data-act="dn:sections:${i}">▼</button></span></summary><div class="fg">${fld(`sections.${i}.show`,'Visible','k',s.show)}${fld(`sections.${i}.nav`,'Nav link text','',s.nav)}${fld(`sections.${i}.label`,'Small label','',s.label)}${fld(`sections.${i}.title`,'Heading','',s.title)}</div></details>`).join('');
if(t=='theme')return`<h4>Site default theme</h4><p>This is what visitors see first. Visitors can also pick their own theme from the ◐ Theme button (turn that off in General).</p><h4>Presets</h4><div class="pre">${Object.keys(PRESETS).map(p=>`<button class="btn" data-act="preset:${p}">${p}</button>`).join('')}</div><h4>Colours</h4><div class="fg">${Object.keys(COL).map(k=>fld('theme.'+k,COL[k],'c',D.theme[k])).join('')}</div><h4>Headline font</h4><div class="fg">${fld('theme.fd','Display font','s',D.theme.fd)}</div>`;
return`<h4>Backup & reset</h4><p>Everything you edit is saved on the server in <code>data/site.json</code>. Uploaded photos live in <code>uploads/</code>.</p><div class="pre"><button class="btn" data-act="export">⬇ Export JSON</button><label class="btn" style="display:inline-flex;align-items:center">⬆ Import JSON<input type="file" accept=".json" data-imp style="display:none"></label><button class="btn r" data-act="reset">Reset everything</button></div>`}
function tabs(){const st=$('ac').scrollTop;$('at').innerHTML=TABS.map(([k,l])=>`<button class="${k==cur?'on':''}" data-tab="${k}">${l}</button>`).join('')+'<button data-act="logout">🔒 Lock</button>';$('ac').innerHTML=view(cur);$('ac').scrollTop=st}
$('ab').onclick=()=>A.classList.add('on');addEventListener('keydown',e=>{if(e.key=='Escape'){A.classList.remove('on');$('tpick').hidden=true}});
A.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?open.add(k):open.delete(k)},true);
A.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.closest('summary'))e.preventDefault();const d=b.dataset;
if('x'in d){A.classList.remove('on');return}if(d.tab){cur=d.tab;tabs();$('ac').scrollTop=0;return}if(!d.act)return;const [a,x,y]=d.act.split(':');
if(a=='logout'){tok='';$('ap').hidden=true;$('gate').hidden=false;$('pin').value='';return}
if(a=='add'){D[x].push(SCH[x].n());open.add(x+'.'+(D[x].length-1));if(x=='crew')ci=D.crew.length-1}
else if(a=='del'){if(!confirm('Delete this item?'))return;D[x].splice(+y,1);open.clear()}
else if(a=='dup'){D[x].splice(+y+1,0,cl(D[x][+y]));open.clear()}
else if(a=='up'||a=='dn'){const j=+y+(a=='up'?-1:1);if(j<0||j>=D[x].length)return;[D[x][+y],D[x][j]]=[D[x][j],D[x][+y]];open.clear()}
else if(a=='clr')set(x,'');else if(a=='preset')Object.assign(D.theme,PRESETS[x]);
else if(a=='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));l.download='retro-runners-backup.json';l.click();return}
else if(a=='reset'){if(!confirm('Reset EVERYTHING to defaults?'))return;D=cl(DEF)}
save();tabs();render()});
A.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;const v=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;set(p,v);
if(t.type=='range'){const b=t.parentElement.querySelector('b');if(b)b.textContent=v}
const w=t.closest('.cw');if(w)w.querySelectorAll('[data-p]').forEach(x=>{if(x!==t&&(x.type!='color'||/^#[0-9a-f]{6}$/i.test(v)))x.value=v});save();render()});
const up=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>fetch('/api/upload',{method:'POST',headers:{'X-Token':tok,'Content-Type':'image/jpeg'},body:b}).then(r=>r.json()).then(j=>j.url?ok(j.url):no()).catch(no),'image/jpeg',.85)};im.onerror=no;im.src=URL.createObjectURL(f)});
A.addEventListener('change',e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
if('imp'in t.dataset){f.text().then(x=>{load(JSON.parse(x));save();tabs();render();toast('Imported')}).catch(()=>toast('Not a valid backup file'));return}
if(t.dataset.up)up(f).then(u=>{set(t.dataset.up,u);save();tabs();render();toast('Image uploaded')}).catch(()=>toast('Upload failed'))});
$('pgo').onclick=()=>fetch('/api/login',{method:'POST',body:JSON.stringify({pin:$('pin').value})}).then(r=>r.json()).then(j=>{if(j.token){tok=j.token;$('gate').hidden=true;$('ap').hidden=false;tabs()}else toast('Wrong PIN')}).catch(()=>toast('Server unreachable'));
$('pin').onkeydown=e=>{if(e.key=='Enter')$('pgo').click()};
/* ===== game ===== */
(()=>{const c=$('gc'),x=c.getContext('2d'),G=160;let y=0,vy=0,ob=[],sp=4.5,sc=0,st='idle',hi=0,f=0;const sky=Array.from({length:14},(_,i)=>[i*50,30+i*37%90,20+i*11%35]);
const reset=()=>{y=0;vy=0;ob=[];sp=2.5+(+D.site.gameSpeed||5)*.4;sc=0;f=0;st='run'};const jump=()=>{if(st!='run')reset();else if(y==0)vy=11.5};
c.onpointerdown=jump;addEventListener('keydown',e=>{if(e.code!='Space'||typing())return;const r=c.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){e.preventDefault();jump()}});
function loop(){x.fillStyle='#1a1030';x.fillRect(0,0,640,200);x.fillStyle='#c8437a';x.fillRect(0,110,640,50);
sky.forEach(([a,h,w],i)=>{const px=((a-f*.5*(1+i%2)+700)%700)-30;x.fillStyle=i%2?'#2f1f55':'#3b2668';x.fillRect(px,G-h-30,w,h+30);x.fillStyle='#ee9a3a';x.fillRect(px+4,G-h-20,4,4)});
x.fillStyle='#14100d';x.fillRect(0,G,640,40);x.fillStyle='#35e0f0';x.fillRect(0,G,640,3);
if(st=='run'){f+=sp;sc+=sp/20;sp+=.0016;vy-=.6;y=Math.max(0,y+vy);if(y==0)vy=0;if(!ob.length||ob[ob.length-1].x<640-(180+Math.random()*220))ob.push({x:660,w:20+Math.random()*16,h:24+Math.random()*24});ob.forEach(o=>o.x-=sp);ob=ob.filter(o=>o.x>-50);
if(ob.some(o=>o.x<78&&o.x+o.w>50&&y<o.h-4)){st='over';hi=Math.max(hi,sc|0)}}
ob.forEach(o=>{x.fillStyle='#d9a441';x.fillRect(o.x,G-o.h,o.w,o.h);x.fillStyle='#14100d';x.fillRect(o.x+3,G-o.h+3,o.w-6,3)});
const py=G-y;x.fillStyle='#ee9a3a';x.fillRect(50,py-18,28,14);x.fillStyle='#d0432b';x.fillRect(66,py-28,8,10);x.fillStyle='#14100d';x.fillRect(52,py-6,8,6);x.fillRect(68,py-6,8,6);
x.fillStyle='#eadfc4';x.font='26px VT323, monospace';x.fillText('SCORE '+(sc|0)+'   HI '+hi,14,26);
if(st!='run'){x.textAlign='center';x.font='34px VT323, monospace';x.fillText(st=='idle'?'TAP TO START':'CRASHED — TAP TO RETRY',320,90);x.textAlign='left'}
requestAnimationFrame(loop)}loop()})();
render();
fetch('/api/data').then(r=>r.json()).then(j=>{load(j);render()}).catch(()=>{});
</script></body></html>
